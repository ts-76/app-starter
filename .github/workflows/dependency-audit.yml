name: Dependency Audit

on:
  pull_request:
    branches:
      - main
    paths:
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - 'apps/*/package.json'
      - 'packages/*/package.json'
  push:
    branches:
      - main
    paths:
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - 'apps/*/package.json'
      - 'packages/*/package.json'
  schedule:
    - cron: '30 15 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Production dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.23.1'

      - name: Audit production dependencies
        run: vp pm audit --production --level moderate
