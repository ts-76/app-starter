name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: '22.23.1'
          cache: true
      - run: vp install --frozen-lockfile
      - run: vp run check
      - run: vp run infra:check
