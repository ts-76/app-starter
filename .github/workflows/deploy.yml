name: Production Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  configuration:
    name: Read deployment mode
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.deployment.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
      - id: deployment
        name: Validate deployment mode
        run: |
          mode="$(node -p "JSON.parse(require('node:fs').readFileSync('config/cloudflare/production.json', 'utf8')).deployment.mode")"
          if [ "$mode" != "github-actions" ] && [ "$mode" != "cloudflare-builds" ]; then
            echo "deployment.mode が不正です: $mode" >&2
            exit 1
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy all Workers
    needs: configuration
    if: needs.configuration.outputs.mode == 'github-actions'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the repository
        run: pnpm check
      - name: Deploy all production Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
        run: pnpm deploy:ci
