name: OSV Scanner

on:
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan:
    name: Dependency vulnerability diff
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    with:
      scan-args: |-
        --lockfile=pnpm-lock.yaml
      upload-sarif: false
      fail-on-vuln: true
